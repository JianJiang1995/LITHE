[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lithe"
version = "1.0.0"
description = "LITHE: Lattice-Indexed Twin Hadamard Encoding for diffusion personalization"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
  {name = "Jian Jiang"},
  {name = "Oya Celiktutan"},
  {name = "Yaohui Wang"},
  {name = "Yutong Ban"},
]
# Core (codebook, quantiser, index files, CPU tests). Pins = reference environment of this release.
dependencies = [
  "torch==2.10.0",
  "numpy==2.2.6",
  "safetensors==0.7.0",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
# FLUX.1-dev training / inference with diffusers
flux = [
  "diffusers==0.37.1",
  "transformers==4.57.6",
  "huggingface_hub>=0.34,<1.0",
  "peft==0.18.1",
  "accelerate==1.12.0",
  "sentencepiece==0.2.1",
  "protobuf==6.33.5",
  "pillow==12.1.1",
]
test = ["pytest>=8.2"]

[tool.setuptools]
packages = ["lithe", "lithe.kernels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
